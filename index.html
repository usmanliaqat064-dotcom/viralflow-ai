<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViralFlow AI - Master Creator</title>
    <style>
        :root { --accent: #8b5cf6; --dark: #0f172a; --light: #f8fafc; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--light); padding: 20px; display: flex; justify-content: center; }
        .app-card { background: white; max-width: 550px; width: 100%; border-radius: 24px; padding: 25px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        .header { text-align: center; margin-bottom: 25px; }
        textarea { width: 100%; border: 2px solid #e2e8f0; border-radius: 15px; padding: 15px; box-sizing: border-box; font-size: 16px; outline: none; transition: 0.3s; }
        textarea:focus { border-color: var(--accent); }
        .tools-grid { display: flex; gap: 8px; margin: 20px 0; }
        .tool-btn { flex: 1; background: #f1f5f9; border: 2px solid transparent; padding: 12px 2px; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 11px; transition: 0.3s; }
        .tool-btn.active { border-color: var(--accent); background: #f5f3ff; color: var(--accent); }
        #generate-btn { width: 100%; background: var(--dark); color: white; border: none; padding: 16px; border-radius: 15px; cursor: pointer; font-size: 18px; font-weight: bold; }
        .output-section { margin-top: 25px; display: none; }
        .hook-item { background: white; border: 1px solid #e2e8f0; padding: 18px; margin-bottom: 15px; border-radius: 16px; position: relative; }
        .score-badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; background: #dcfce7; color: #166534; margin-bottom: 10px; }
        .copy-btn { position: absolute; right: 15px; top: 15px; background: var(--accent); color: white; border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; }
        .text-content { font-size: 14px; line-height: 1.6; white-space: pre-wrap; color: #334155; }
    </style>
</head>
<body>

<div class="app-card">
    <div class="header">
        <h1>ViralFlow AI 🚀</h1>
        <p>Analyze & Generate Viral Content</p>
    </div>

    <textarea id="topic" rows="3" placeholder="Enter your title (e.g. How a Billion Dollars Would Ruin Your Life)"></textarea>

    <div class="tools-grid">
        <button id="btnHooks" class="tool-btn active" onclick="setMode('hooks')">🪝 Viral Hooks</button>
        <button id="btnShort" class="tool-btn" onclick="setMode('short')">📱 Short Script</button>
        <button id="btnLong" class="tool-btn" onclick="setMode('long')">🎬 Master Script</button>
    </div>

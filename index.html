<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViralFlow AI</title>
    <style>
        :root { --accent: #8b5cf6; --dark: #0f172a; --light: #f8fafc; }
        body { font-family: sans-serif; background: var(--light); padding: 20px; display: flex; justify-content: center; }
        .app-card { background: white; max-width: 500px; width: 100%; border-radius: 24px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .header { text-align: center; margin-bottom: 20px; }
        textarea { width: 100%; border: 2px solid #f1f5f9; border-radius: 12px; padding: 15px; box-sizing: border-box; }
        .tools-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 20px 0; }
        .tool-btn { background: #f1f5f9; border: none; padding: 10px; border-radius: 10px; cursor: pointer; }
        #generate-btn { width: 100%; background: var(--dark); color: white; border: none; padding: 15px; border-radius: 12px; cursor: pointer; font-size: 16px; }
        .output-section { margin-top: 20px; display: none; }
        .hook-item { background: #f5f3ff; border-left: 4px solid var(--accent); padding: 10px; margin-bottom: 10px; border-radius: 5px; position: relative; }
        .copy-btn { position: absolute; right: 5px; top: 5px; font-size: 10px; cursor: pointer; background: white; border: 1px solid #ddd; padding: 2px 5px; }
    </style>
</head>
<body>

<div class="app-card">
    <div class="header">
        <h1>ViralFlow AI 🚀</h1>
        <p>Turn your ideas into viral gold.</p>
    </div>

    <textarea id="topic" rows="3" placeholder="Enter your topic (e.g. Solar panels, YouTube growth)"></textarea>

    <div class="tools-grid">
        <button class="tool-btn">🪝 Viral Hooks</button>
        <button class="tool-btn">📜 Script</button>
    </div>

    <button id="generate-btn" onclick="startGenerating()">Generate Viral Magic</button>

    <div class="output-section" id="output">
        <h3>Results:</h3>
        <div id="results-container"></div>
    </div>
</div>

<script>
    function startGenerating() {
        const topic = document.getElementById('topic').value;
        if(!topic) return alert("Please enter a topic!");

        const container = document.getElementById('results-container');
        document.getElementById('output').style.display = "block";
        
        const viralHooks = [
            `"The secret to ${topic} that 99% of people missed!"`,
            `"Stop doing ${topic} the old way! Do this instead."`,
            `"I tried ${topic} for 30 days. Here is what happened..."`,
            `"Why nobody is talking about this ${topic} hack?"`
        ];

        container.innerHTML = viralHooks.map(hook => `
            <div class="hook-item">
                <span class="copy-btn" onclick="copyMe('${hook}')">Copy</span>
                ${hook}
            </div>
        `).join('');
    }

    function copyMe(text) {
        navigator.clipboard.writeText(text);
        alert("Copied!");
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViralFlow AI | Viral Content Architect</title>
    <style>
        :root {
            --accent: #8b5cf6; /* Purple for Creativity */
            --dark: #0f172a;
            --light: #f8fafc;
        }

        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--light); color: var(--dark); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .app-card { background: white; max-width: 500px; width: 100%; border-radius: 24px; padding: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.05); }
        
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 28px; margin: 0; color: var(--accent); }
        .header p { font-size: 14px; color: #64748b; }

        .input-area { margin-bottom: 20px; }
        textarea { width: 100%; border: 2px solid #f1f5f9; border-radius: 16px; padding: 15px; font-size: 16px; resize: none; box-sizing: border-box; outline-color: var(--accent); }

        .tools-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .tool-btn { background: #f1f5f9; border: none; padding: 12px; border-radius: 12px; cursor: pointer; font-weight: 600; font-size: 13px; transition: 0.3s; color: #475569; }
        .tool-btn:hover { background: var(--accent); color: white; }

        #generate-btn { width: 100%; background: var(--dark); color: white; border: none; padding: 16px; border-radius: 16px; font-size: 18px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        #generate-btn:hover { transform: scale(1.02); background: #1e293b; }

        .output-section { margin-top: 30px; display: none; border-top: 2px solid #f1f5f9; padding-top: 20px; }
        .hook-item { background: #f5f3ff; border-left: 4px solid var(--accent); padding: 12px; border-radius: 8px; margin-bottom: 12px; font-size: 15px; line-height: 1.5; position: relative; }
        .copy-badge { position: absolute; right: 10px; top: 10px; font-size: 10px; background: white; padding: 2px 6px; border-radius: 4px; cursor: pointer; border: 1px solid #ddd; }
    </style>
</head>
<body>

<div class="app-card">
    <div class="header">
        <h1>ViralFlow AI 🚀</h1>
        <p>Turn your boring ideas into viral gold.</p>
    </div>

    <div class="input-area">
        <textarea id="topic" rows="3" placeholder="Describe your video or post idea in simple words..."></textarea>
    </div>

    <div class="tools-grid">
        <button class="tool-btn" onclick="selectTool('hooks')">🪝 Viral Hooks</button>
        <button class="tool-btn" onclick="selectTool('script')">📜 Short Script</button>
        <button class="tool-btn" onclick="selectTool('titles')">💎 Clicky Titles</button>
        <button class="tool-btn" onclick="selectTool('tags')">🏷️ Trending Tags</button>
    </div>

    <button id="generate-btn" onclick="startGenerating()">Generate Viral Magic</button>

    <div class="output-section" id="output">
        <h3 id="output-title" style="margin-bottom: 15px; font-size: 18px;">Top Results:</h3>
        <div id="results-container">
            </div>
    </div>
</div>

<script>
    function selectTool(tool) {
        alert(tool + " tool selected! Ready to generate.");
    }

    function startGenerating() {
        const topic = document.getElementById('topic').value;
        if(!topic) return alert("Please enter an idea first!");

        // Showing results (This will be connected to AI later)
        document.getElementById('output').style.display = "block";
        const container = document.getElementById('results-container');
        container.innerHTML = `
            <div class="hook-item">
                <span class="copy-badge">Copy</span>
                "The secret to [Topic] that 99% of people missed in 2026..."
            </div>
            <div class="hook-item">
                <span class="copy-badge">Copy</span>
                "I tried [Topic] for 30 days, and it changed everything. Here's how..."
            </div>
        `;
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViralFlow AI - Ultimate Creator Tool</title>
    <style>
        :root { --accent: #8b5cf6; --dark: #0f172a; --light: #f8fafc; --success: #22c55e; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--light); padding: 20px; display: flex; justify-content: center; }
        .app-card { background: white; max-width: 600px; width: 100%; border-radius: 28px; padding: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.1); }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: var(--dark); font-size: 32px; margin-bottom: 5px; }
        .header p { color: #64748b; font-size: 16px; }
        textarea { width: 100%; border: 2px solid #e2e8f0; border-radius: 18px; padding: 18px; box-sizing: border-box; font-size: 16px; outline: none; transition: 0.3s; resize: none; }
        textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.1); }
        .tools-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin: 25px 0; }
        .tool-btn { background: #f1f5f9; border: 2px solid transparent; padding: 12px 5px; border-radius: 14px; cursor: pointer; font-weight: bold; font-size: 13px; color: #475569; transition: 0.3s; }
        .tool-btn.active { border-color: var(--accent); background: #f5f3ff; color: var(--accent); }
        #generate-btn { width: 100%; background: var(--dark); color: white; border: none; padding: 18px; border-radius: 18px; cursor: pointer; font-size: 18px; font-weight: bold; transition: 0.2s; }
        #generate-btn:hover { background: #1e293b; }
        #generate-btn:active { transform: scale(0.97); }
        .output-section { margin-top: 30px; display: none; border-top: 2px solid #f1f5f9; padding-top: 20px; }
        .hook-item { background: white; border: 1px solid #e2e8f0; padding: 20px; margin-bottom: 20px; border-radius: 16px; position: relative; }
        .score-badge { display: inline-block; padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-bottom: 10px; background: #dcfce7; color: #166534; }
        .copy-btn { position: absolute; right: 15px; top: 15px; background: var(--accent); color: white; border: none; padding: 7px 15px; border-radius: 10px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .text-content { font-size: 15px; line-height: 1.6; color: #1e293b; white-space: pre-wrap; }
    </style>
</head>
<body>

<div class="app-card">
    <div class="header">
        <h1>ViralFlow AI 🚀</h1>
        <p>Your AI Content Strategist</p>
    </div>

    <textarea id="topic" rows="3" placeholder="Describe your video idea (e.g. How to grow on YouTube 2026)"></textarea>

    <div class="tools-grid">
        <button id="btnHooks" class="tool-btn active" onclick="setMode('hooks')">🪝 Viral Hooks</button>
        <button id="btnShort" class="tool-btn" onclick="setMode('short')">📱 Short Script</button>
        <button id="btnLong" class="tool-btn" onclick="setMode('long')">🎬 Master Script</button>
    </div>

    <button id="generate-btn" onclick="startGenerating()">Generate & Analyze Magic</button>

    <div class="output-section" id="output">
        <h3 style="margin-bottom: 15px;">Optimization Results:</h3>
        <div id="results-container"></div>
    </div>
</div>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViralFlow AI - Earning Machine</title>
    <style>
        :root { --accent: #8b5cf6; --dark: #0f172a; --light: #f8fafc; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--light); padding: 20px; display: flex; justify-content: center; }
        .app-card { background: white; max-width: 600px; width: 100%; border-radius: 28px; padding: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.1); }
        .header { text-align: center; margin-bottom: 25px; }
        textarea { width: 100%; border: 2px solid #e2e8f0; border-radius: 18px; padding: 18px; box-sizing: border-box; font-size: 16px; outline: none; transition: 0.3s; resize: none; }
        textarea:focus { border-color: var(--accent); }
        .tools-grid { display: flex; gap: 10px; margin: 25px 0; }
        .tool-btn { flex: 1; background: #f1f5f9; border: 2px solid transparent; padding: 12px; border-radius: 14px; cursor: pointer; font-weight: bold; font-size: 12px; transition: 0.3s; }
        .tool-btn.active { border-color: var(--accent); background: #f5f3ff; color: var(--accent); }
        #generate-btn { width: 100%; background: var(--dark); color: white; border: none; padding: 18px; border-radius: 18px; cursor: pointer; font-size: 18px; font-weight: bold; }
        .output-section { margin-top: 30px; display: none; }
        .hook-item { background: white; border: 1px solid #e2e8f0; padding: 20px; margin-bottom: 20px; border-radius: 20px; position: relative; }
        .score-badge { display: inline-block; padding: 6px 15px; border-radius: 25px; font-size: 12px; font-weight: bold; background: #dcfce7; color: #166534; margin-bottom: 15px; }
        .copy-btn { position: absolute; right: 20px; top: 20px; background: var(--accent); color: white; border: none; padding: 8px 16px; border-radius: 10px; cursor: pointer; font-weight: bold; }
        .text-content { font-size: 15px; line-height: 1.7; white-space: pre-wrap; color: #1e293b; }
        .section-tag { color: var(--accent); font-weight: bold; display: block; margin-top: 15px; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>

<div class="app-card">
    <div class="header">
        <h1>ViralFlow AI 🚀</h1>
        <p>Create Viral Content & Earn Money</p>
    </div>

    <textarea id="topic" rows="3" placeholder="Enter your viral title (e.g. How a Billion Dollars Would Ruin Your Life)"></textarea>

    <div class="tools-grid">
        <button id="btnHooks" class="tool-btn active" onclick="setMode('hooks')">🪝 3 Viral Hooks</button>
        <button id="btnShort" class="tool-btn" onclick="setMode('short')">📱 Shorts/Reels</button>
        <button id="btnLong" class="tool-btn" onclick="setMode('long')">🎬 Master Script</button>
    </div>

    <button id="generate-btn" onclick="startGenerating()">Generate & Score Magic</button>

    <div class="output-section" id="output">
        <div id="results-container"></div>
    </div>
</div>

<script>
    var currentMode = 'hooks';

    function setMode(mode) {
        currentMode = mode;
        document.getElementById('btnHooks').classList.toggle('active', mode === 'hooks');
        document.getElementById('btnShort').classList.toggle('active', mode === 'short');
        document.getElementById('btnLong').classList.toggle('active', mode === 'long');
    }

    function startGenerating() {
        var topic = document.getElementById('topic').value;
        if(!topic) return alert("Please enter a topic!");

        var container = document.getElementById('results-container');
        document.getElementById('output').style.display = "block";
        var content = "";
        var score = 95;

        if(currentMode === 'hooks') {
            content = "🪝 HOOK 1 (Shocking): \"99% of people want " + topic + ", but I'll show you why it's a trap.\"\n\n" +
                      "🪝 HOOK 2 (Curiosity): \"I analyzed what happens after " + topic + " and the results are terrifying.\"\n\n" +
                      "🪝 HOOK 3 (The Flip): \"Forget everything you know about " + topic + ". This is the real truth.\"";
        } else if(currentMode === 'short') {
            content = "⏱️ --- 60 SEC SHORT SCRIPT ---\n\n" +
                      "[0:00] THE HOOK: \"Stop scrolling! You won't believe how " + topic + " actually works.\"\n" +
                      "[0:10] THE VALUE: \"Most gurus lie to you about this, but here's the 1-minute breakdown...\"\n" +
                      "[0:45] THE CTA: \"Subscribe if you want to master " + topic + "!\"";
        } else {
            score = 100;
            content = "🎬 --- 20 MINUTE MASTER SCRIPT PLAN: " + topic + " ---\n\n" +
                      "📌 STEP 1: THE MEGA HOOK (0:00-2:00)\n" +
                      "Focus: \"The Illusion of " + topic + "\"\n" +
                      "PROMPT: \"Write a high-energy 500-word intro for a video titled '" + topic + "'. Use psychological triggers and hook the audience.\"\n\n" +
                      "📌 STEP 2: THE UNKNOWN REALITY (2:00-7:00)\n" +
                      "Focus: \"The Dark Side of " + topic + "\"\n" +
                      "PROMPT: \"Write 1500 words on the hidden dangers and social impact of " + topic + ". Include 3 real-life examples.\"\n\n" +
                      "📌 STEP 3: THE EXPERT BREAKDOWN (7:00-14:00)\n" +
                      "Focus: \"Mechanics of Failure with " + topic + "\"\n" +
                      "PROMPT: \"Expand on the technical and financial aspects of " + topic + ". Why do most people lose everything? Provide a detailed 2000-word analysis.\"\n\n" +
                      "📌 STEP 4: THE SUCCESS ROADMAP (14:00-18:00)\n" +
                      "Focus: \"How to Survive " + topic + "\"\n" +
                      "PROMPT: \"Write a 1200-word guide on the right mindset for " + topic + ". How can someone stay grounded and profitable?\"\n\n" +
                      "📌 STEP 5: CLOSING & CALL TO ACTION (18:00-20:00)\n" +
                      "Focus: \"Your Next Step\"\n" +
                      "PROMPT: \"Write a powerful 500-word ending. Ask the viewers to share their thoughts on " + topic + " and subscribe for more AI-driven insights.\"";
        }

        container.innerHTML = '<div class="hook-item">' +
            '<div class="score-badge">Viral Score: ' + score + '/100</div>' +
            '<button class="copy-btn" onclick="copyResult()">Copy Master Script</button>' +
            '<div id="copyArea" class="text-content">' + content + '</div>' +
            '</div>';
    }

    function copyResult() {
        var text = document.getElementById('copyArea').innerText;
        var temp = document.createElement('textarea');
        temp.value = text;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand('copy');
        document.body.removeChild(temp);
        alert("Success! Now paste it in Claude or ChatGPT to expand your script.");
    }
</script>

</body>
</html>
